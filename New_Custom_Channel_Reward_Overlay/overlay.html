  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      overflow: hidden; background: transparent !important;
      font-family: 'Inter', sans-serif;
    }
    .avatar-circle   { border-radius: 9999px; }
    .avatar-squircle { border-radius: 28%; }
    .avatar-rounded  { border-radius: 12px; }
    .avatar-sharp    { border-radius: 2px; }
    .avatar-hex      { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }
    .avatar-diamond  { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
    .avatar-octagon  { clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }
    .avatar-shield   { clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); }
    .avatar-blade    { clip-path: polygon(0 12%, 88% 0, 100% 88%, 12% 100%); }
    .avatar-arch     { border-radius: 50% 50% 14% 14% / 46% 46% 14% 14%; }
    .avatar-bevel    { clip-path: polygon(22% 0, 100% 0, 100% 78%, 78% 100%, 0 100%, 0 22%); }

    .font-orbitron  { font-family: 'Orbitron', sans-serif; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
    .font-arcade    { font-family: 'Press Start 2P', monospace; }
    .font-rajdhani  { font-family: 'Rajdhani', sans-serif; }
    .font-righteous { font-family: 'Righteous', sans-serif; }

    .timer-stack-item { transition: all .45s cubic-bezier(.22,1,.36,1); }

    @keyframes sbAmbientGlow {
      0%,100% { box-shadow: 0 10px 30px -8px var(--amb-c, rgba(99,102,241,.5)); }
      50%     { box-shadow: 0 10px 46px -4px var(--amb-c, rgba(99,102,241,.95)); }
    }
    @keyframes sbAmbientFloat   { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} }
    @keyframes sbAmbientBreathe { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.016);} }
    @keyframes sbAmbientTilt    { 0%,100%{ transform: rotate(-.5deg);} 50%{ transform: rotate(.5deg);} }
    @keyframes sbSheen          { 0%{ background-position: -220% 0; } 100%{ background-position: 220% 0; } }
    @keyframes sbScanDrift      { 0%{ transform: translateY(-100%);} 100%{ transform: translateY(260%);} }
    @keyframes sbBorderRun      { 0%{ background-position: 0% 50%; } 100%{ background-position: 300% 50%; } }
    @keyframes sbUrgentFlash    { 0%,100%{ opacity: .18; } 50%{ opacity: .55; } }

    .amb-glow    { animation: sbAmbientGlow 2.6s ease-in-out infinite; }
    .amb-float   { animation: sbAmbientFloat 3.4s ease-in-out infinite; }
    .amb-breathe { animation: sbAmbientBreathe 3s ease-in-out infinite; }
    .amb-tilt    { animation: sbAmbientTilt 4.2s ease-in-out infinite; }

    .fx-sheen::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: linear-gradient(110deg, transparent 32%, rgba(255,255,255,.17) 48%, transparent 64%);
      background-size: 220% 100%;
      animation: sbSheen 3.4s ease-in-out infinite;
    }
    .fx-scan::after {
      content: ""; position: absolute; left: 0; right: 0; height: 26%;
      pointer-events: none; z-index: 2;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,.1), transparent);
      animation: sbScanDrift 3.1s linear infinite;
    }
    .fx-runline {
      background-image: linear-gradient(90deg,
        var(--run-a, #6366f1), var(--run-b, #a855f7), var(--run-a, #6366f1),
        var(--run-b, #a855f7), var(--run-a, #6366f1));
      background-size: 300% 100%;
      animation: sbBorderRun 3.6s linear infinite;
    }
    .timer-urgent { animation: sbAmbientGlow 1s ease-in-out infinite; }
    .timer-urgent .urgent-veil { animation: sbUrgentFlash 1s ease-in-out infinite; }
  </style>
</head>

    /* ---------------- AUDIO ---------------- */
    function playSynthSound(preset, customUrl, isTimerEnd) {
      if (STATE.config.volume <= 0) return;
      if (customUrl && customUrl.length > 4) {
        const a = new Audio(customUrl);
        a.volume = STATE.config.volume;
        a.play().catch(() => {});
        return;
      }
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const notes = preset.notes || [1, 1.25, 1.5, 2];
        const step = preset.tempo || 0.08;
        notes.forEach((mult, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = preset.wave || "triangle";
          const startTime = now + idx * step;
          const dur = step * (isTimerEnd ? 1.8 : 1.5);
          osc.frequency.setValueAtTime(preset.baseFreq * mult, startTime);
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(0.25 * STATE.config.volume, startTime + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + dur + 0.02);
        });
      } catch (e) {}
    }

    function playTick() {
      if (STATE.config.volume <= 0) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(1180, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.14 * STATE.config.volume, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.1);
      } catch (e) {}
    }

    /* ---------------- PARSER (identical to the studio) ---------------- */
    var TIME_TAG_END_RX = /\(\s*(\d+)\s*:\s*(\d+)(?:\s*:\s*(\d+))?\s*\)\s*$/;
    var TIME_TAG_ANY_RX = /\(\s*(\d+)\s*:\s*(\d+)(?:\s*:\s*(\d+))?\s*\)/;

    function parseRewardTimerFromDescription(desc, titleFallback) {
      const combined = ((desc || "") + " " + (titleFallback || "")).trim();
      if (!combined) return null;
      const m = (desc && desc.match(TIME_TAG_END_RX))
             || (desc && desc.match(TIME_TAG_ANY_RX))
             || combined.match(TIME_TAG_END_RX)
             || combined.match(TIME_TAG_ANY_RX);
      if (!m) return null;
      let h = 0, min = 0, s = 0;
      if (m[3] !== undefined) { h = parseInt(m[1],10)||0; min = parseInt(m[2],10)||0; s = parseInt(m[3],10)||0; }
      else { min = parseInt(m[1],10)||0; s = parseInt(m[2],10)||0; }
      const totalSeconds = h * 3600 + min * 60 + s;
      if (totalSeconds <= 0) return null;
      return { totalSeconds: totalSeconds, formattedDuration: formatHumanDuration(totalSeconds) };
    }

    function stripTag(text) {
      if (!STATE.config.stripTimeTag) return text || "";
      return String(text || "").replace(TIME_TAG_END_RX, "").replace(/\s*[-–—]\s*$/, "").trim();
    }

    function formatHumanDuration(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const parts = [];
      if (h > 0) parts.push(h + (h === 1 ? " Hour" : " Hours"));
      if (m > 0) parts.push(m + (m === 1 ? " Min" : " Mins"));
      if (s > 0 && h === 0) parts.push(s + (s === 1 ? " Sec" : " Secs"));
      return parts.length > 0 ? parts.join(" ") : "0 Secs";
    }

    function formatClockReadout(sec) {
      const s = Math.max(0, Math.floor(sec));
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) return hrs + ":" + String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
      return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    }

    /* ---------------- CHAT BRIDGE (DoAction — unchanged) ---------------- */
    function sendChatCallback(platform, messageText, stage, redemptionId, extraVars) {
      if (!messageText) return;
      const stageLower = (stage || "start").toLowerCase();
      const isEnd = stageLower === "end";
      const isKick = (platform || "twitch").toLowerCase() === "kick";
      const key = (redemptionId || "msg") + ":" + stageLower;

      const slot = isKick
        ? (isEnd ? actionSlots.kickEnd : actionSlots.kickStart)
        : (isEnd ? actionSlots.twitchEnd : actionSlots.twitchStart);

      if (!slot || !slot.name) return;
      if (redemptionId && sentChatDedupe.has(key)) return;
      if (redemptionId) sentChatDedupe.add(key);

      const customArgKey = isEnd
        ? (STATE.config.endArgName || "timerMessage").trim()
        : (STATE.config.startArgName || "rewardMessage").trim();

      if (ws && ws.readyState === WebSocket.OPEN) {
        const actionObj = { name: slot.name };
        if (slot.id) actionObj.id = slot.id;
        const vars = extraVars || {};
        const args = {};
        args[customArgKey] = messageText;
        args.rewardMessage = messageText;
        args.timerMessage  = messageText;
        args.chatMessage   = messageText;
        args.message       = messageText;
        args.rawInput      = messageText;
        args.platform      = platform || "twitch";
        args.eventPhase    = stageLower;
        args.user          = vars.user || "";
        args.reward        = vars.reward || "";
        args.description   = vars.description || "";
        args.duration      = vars.duration || "";
        args.redemptionId  = redemptionId || ("obs_" + Date.now());

        ws.send(JSON.stringify({
          request: "DoAction",
          action: actionObj,
          args: args,
          id: "obs_chat_" + Date.now()
        }));
      }
    }

    async function resolveAvatar(platform, userLogin, currentAvatar) {
      if (currentAvatar && currentAvatar.startsWith("http") && !currentAvatar.includes("unavatar.io")) return currentAvatar;
      if (platform === "twitch" && userLogin) {
        try {
          const r = await fetch("https://decapi.me/twitch/avatar/" + encodeURIComponent(userLogin));
          if (r.ok) {
            const txt = (await r.text()).trim();
            if (txt.startsWith("http")) return txt;
          }
        } catch (e) {}
      }
      return currentAvatar || ("https://unavatar.io/" + platform + "/" + encodeURIComponent(userLogin || "streamer"));
    }

    async function triggerRewardEvent(payload) {
      const platform = (payload.platform || "twitch").toLowerCase();
      const user = payload.user || "Viewer";
      const userLogin = payload.userLogin || user;
      const title = payload.title || "Channel Reward";
      const description = (payload.description || "").trim();
      const redemptionId = payload.redemptionId || ("obs_red_" + Date.now() + "_" + Math.random().toString(36).slice(2,6));
      const avatar = await resolveAvatar(platform, userLogin, payload.avatar);

      const timerInfo = payload.durationSeconds
        ? { totalSeconds: Number(payload.durationSeconds), formattedDuration: payload.humanDuration || formatHumanDuration(Number(payload.durationSeconds)) }
        : parseRewardTimerFromDescription(description, title);

      playSynthSound(STATE.alertSound, STATE.config.customAlertAudioUrl, false);
      renderMainAlert({
        platform: platform, user: user, avatar: avatar, title: title,
        description: stripTag(description), timerInfo: timerInfo, fx: pickAlertFx()
      });

      const humanDur = timerInfo ? timerInfo.formattedDuration : "Instant";
      if (!payload.startChatSent) {
        let startMsg = STATE.config.startChatTemplate
          .replace(/\{user\}/gi, user)
          .replace(/\{reward\}/gi, title)
          .replace(/\{description\}/gi, description)
          .replace(/\{duration\}/gi, humanDur);
        if (!description) startMsg = startMsg.replace(/\s*-\s*$/, "").trim();
        sendChatCallback(platform, startMsg, "start", redemptionId, {
          user: user, reward: title, description: description, duration: humanDur
        });
      }

      if (timerInfo && timerInfo.totalSeconds > 0) {
        const tObj = {
          id: "t_" + Date.now() + "_" + Math.random().toString(36).slice(2,6),
          redemptionId: redemptionId,
          platform: platform, user: user, avatar: avatar, title: title, description: description,
          totalSec: timerInfo.totalSeconds,
          remainingSec: timerInfo.totalSeconds,
          durationLabel: timerInfo.formattedDuration,
          fx: pickTimerFx(),
          updatedAt: Date.now()
        };
        if (STATE.config.moveNewestToTop) activeTimers.unshift(tObj);
        else activeTimers.push(tObj);
        renderTimers(tObj.id);
        startTimerLoop();
      }

          +   clockBox('text-lg')
          + '</div></div>';
      }

      if (s.archetype === "compact-pill") {
        return wrapOpen('rounded-full px-4 py-2.5',
          'background: linear-gradient(90deg, ' + s.bg1 + ', ' + s.bg2 + '); border: 2px solid ' + s.accent + '; box-shadow: 0 6px 20px ' + s.glow + ';')
          + urgentVeil
          + '<div class="flex items-center justify-between gap-3 relative z-10">'
          +   '<div class="flex items-center gap-2.5 min-w-0">'
          +     (showUser ? '<img src="' + escapeHtml(t.avatar) + '" class="w-8 h-8 rounded-full object-cover border border-white/30 shrink-0" />' : '')
          +     '<div class="min-w-0"><div class="text-xs font-extrabold truncate">' + escapeHtml(t.title) + '</div>'
          +     (showUser ? '<div class="text-[10px] truncate" style="color:' + s.sub + ';">' + escapeHtml(t.user) + '</div>' : '')
          +     '</div>'
          +   '</div>'
          +   '<div id="timer-clock-' + t.id + '" class="font-mono-tech text-base font-black px-3 py-0.5 rounded-full bg-black/50 shrink-0" style="color:' + s.accent + ';">' + clockStr + '</div>'
          + '</div>'
          + (showBar ? '<div id="timer-bar-' + t.id + '" class="absolute bottom-0 left-0 h-1 transition-all duration-500" style="width:' + pct + '%; background:' + s.accent + ';"></div>' : '')
          + '</div>';
      }

      if (s.archetype === "side-rail") {
        return wrapOpen(master.radius + ' pl-0 pr-3.5 py-3',
          'background: linear-gradient(135deg, ' + s.bg1 + 'f5, ' + s.bg2 + 'f5); border: 1px solid ' + s.accent + '55; box-shadow: 0 8px 22px ' + s.glow + ';')
          + urgentVeil
          + '<div class="flex items-stretch gap-3 relative z-10">'
          +   '<div class="w-1.5 rounded-r-full shrink-0" style="background:' + s.accent + '; box-shadow: 0 0 12px ' + s.glow + ';"></div>'
          +   '<div class="flex-1 min-w-0 flex items-center gap-3">'
          +     (showUser ? avatarImg : '')
          +     '<div class="flex-1 min-w-0">' + userLine
          +       '<div class="text-sm font-extrabold truncate mt-0.5">' + escapeHtml(t.title) + '</div>'
          +       progressBar(false)
          +     '</div>'
          +     clockBox('text-lg')
          +   '</div>'
          + '</div></div>';
      }

      if (s.archetype === "minimal-text") {
        return wrapOpen('px-1 py-1.5', 'background: transparent;')
          + '<div class="flex items-center justify-between gap-3 relative z-10" style="text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 22px ' + s.glow + ';">'
          +   '<div class="min-w-0"><div class="text-sm font-extrabold truncate" style="color:' + s.text + ';">' + escapeHtml(t.title) + '</div>'
          +   (showUser ? '<div class="text-[10px] truncate" style="color:' + s.sub + ';">' + escapeHtml(t.user) + '</div>' : '') + '</div>'
          +   '<div id="timer-clock-' + t.id + '" class="font-mono-tech text-xl font-black tracking-wider shrink-0" style="color:' + s.accent + ';">' + clockStr + '</div>'
          + '</div>'
          + (showBar ? '<div class="w-full h-0.5 mt-1.5 rounded-full overflow-hidden" style="background:rgba(255,255,255,.14);"><div id="timer-bar-' + t.id + '" class="h-full transition-all duration-500" style="width:' + pct + '%; background:' + s.accent + ';"></div></div>' : '')
          + '</div>';
      }

      if (s.archetype === "badge-block") {
        return wrapOpen(master.radius + ' p-3',
          'background: linear-gradient(160deg, ' + s.bg1 + 'f7, ' + s.bg2 + 'f7); border: 1.5px solid ' + s.accent + '; box-shadow: 0 10px 26px ' + s.glow + ';')
          + urgentVeil
          + '<div class="relative z-10">'
          +   '<div class="flex items-center gap-2 mb-2">'
          +     (showUser ? '<img src="' + escapeHtml(t.avatar) + '" class="w-7 h-7 ' + master.avatarClip + ' object-cover shrink-0" style="border:1.5px solid ' + s.accent + ';" />' : '')
          +     '<div class="flex-1 min-w-0"><div class="text-[13px] font-extrabold truncate">' + escapeHtml(t.title) + '</div>'
          +     (showUser ? '<div class="text-[10px] truncate" style="color:' + s.sub + ';">' + escapeHtml(t.user) + '</div>' : '') + '</div>'
          +     topChip
          +   '</div>'
          +   '<div id="timer-clock-' + t.id + '" class="font-mono-tech text-2xl font-black text-center py-1.5 rounded-lg bg-black/45 border border-white/10 tracking-widest" style="color:' + s.accent + ';">' + clockStr + '</div>'
          +   progressBar(false)
          + '</div></div>';
      }

      if (s.archetype === "glass-capsule") {
        return wrapOpen('rounded-2xl p-3.5',
          'background: ' + s.bg2 + '66; backdrop-filter: blur(11px); border: 1px solid ' + s.accent + '77; box-shadow: 0 8px 28px ' + s.glow + ', inset 0 1px 0 rgba(255,255,255,.14);')
          + urgentVeil
          + '<div class="flex items-center justify-between gap-3 relative z-10">'
          +   '<div class="flex items-center gap-2.5 min-w-0">' + (showUser ? avatarImg : '')
          +     '<div class="min-w-0">' + userLine + '<div class="text-sm font-extrabold truncate mt-0.5">' + escapeHtml(t.title) + '</div></div>'
          +   '</div>'
          +   clockBox('text-lg')
          + '</div>' + progressBar(false) + '</div>';
      }

      if (s.archetype === "arcade-7seg") {
        return wrapOpen('rounded-md p-3',
          'background: ' + s.bg1 + '; border: 2px solid ' + s.accent + '; box-shadow: 0 0 0 2px ' + s.bg2 + ', 0 8px 22px ' + s.glow + ';')
          + urgentVeil
          + '<div class="flex items-center justify-between gap-3 relative z-10">'
          +   '<div class="min-w-0">' + userLine + '<div class="text-[11px] font-arcade truncate mt-1" style="color:' + s.text + ';">' + escapeHtml(t.title) + '</div></div>'
          +   '<div id="timer-clock-' + t.id + '" class="font-arcade text-sm px-2 py-1.5 rounded shrink-0" style="color:' + s.accent + '; background:#000; border:1px solid ' + s.accent + '55; text-shadow: 0 0 9px ' + s.accent + ';">' + clockStr + '</div>'
          + '</div>' + progressBar(true) + '</div>';
      }

      const isSegmented = s.archetype === "segmented-led";
      const isSplit     = s.archetype === "dual-split";
      const isHolo      = s.archetype === "holo-strip";
      const bg = isSplit
        ? 'linear-gradient(90deg, ' + s.bg1 + ' 0%, ' + s.bg1 + ' 52%, ' + s.bg2 + ' 52%, ' + s.bg2 + ' 100%)'
        : 'linear-gradient(135deg, ' + s.bg1 + 'f5, ' + s.bg2 + 'f5)';

      return wrapOpen(master.radius + ' p-3.5',
        'background: ' + bg + '; border: 1.5px solid ' + s.accent + '; box-shadow: 0 8px 25px ' + s.glow + ';')
        + urgentVeil
        + (isHolo ? '<div class="absolute bottom-0 left-0 right-0 h-1 fx-runline" style="--run-a:' + s.accent + '; --run-b:' + s.sub + ';"></div>' : '')
        + '<div class="flex items-center justify-between gap-3 relative z-10">'
        +   '<div class="flex items-center gap-2.5 min-w-0">' + (showUser ? avatarImg : '')
        +     '<div class="min-w-0">' + userLine
        +       '<div class="text-xs sm:text-sm font-extrabold truncate mt-0.5" style="color:' + s.text + ';">' + escapeHtml(t.title) + '</div>'
        +     '</div>'
        +   '</div>'
        +   clockBox('text-base sm:text-lg')
        + '</div>' + progressBar(isSegmented) + '</div>';
    }

    function renderTimers(newlyAddedId) {
      const container = document.getElementById("activeTimersStack");
      if (STATE.config.moveNewestToTop) activeTimers.sort((a, b) => b.updatedAt - a.updatedAt);

      const cap = Math.max(1, Number(STATE.config.maxVisibleTimers) || 6);
      const visible = activeTimers.slice(0, cap);
      const hidden = activeTimers.length - visible.length;

      container.innerHTML = visible.map((t, index) => {
        const fx = t.fx || STATE.fx;
        const entryStyle = (t.id === newlyAddedId)
          ? 'transform: ' + fx.inTx + '; opacity: 0; filter: blur(' + (fx.blur || '0px') + '); transition: transform ' + fx.dur + 'ms ' + fx.ease + ', opacity ' + fx.dur + 'ms ease, filter ' + fx.dur + 'ms ease;'
          : 'transform: translate(0,0) scale(1); opacity: 1; filter: blur(0px);';
        return buildTimerCardHTML(t, entryStyle, index === 0 && visible.length > 1 && STATE.config.moveNewestToTop);
      }).join("");

      const overflow = document.getElementById("timerOverflowSlot");
      if (overflow) {
        const s = STATE.timerStyle;
        overflow.innerHTML = hidden > 0
          ? '<div class="self-end px-2.5 py-1 rounded-full text-[10px] font-mono-tech font-bold" style="background:' + s.bg2 + 'dd;border:1px solid ' + s.accent + '66;color:' + s.accent + ';">+' + hidden + ' more running</div>'
          : '';
      }

      const ambCls = STATE.ambientTimerCls || "";

      if (newlyAddedId) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const el = document.getElementById("timer-card-" + newlyAddedId);
          if (el) { el.style.transform = "translate(0,0) scale(1) rotate(0deg) skew(0deg)"; el.style.opacity = "1"; el.style.filter = "blur(0px)"; }
        }));
        if (ambCls) {
          const added = activeTimers.filter(x => x.id === newlyAddedId)[0];
          const dur = (added && added.fx && added.fx.dur) || 450;
          setTimeout(() => addAmbient(document.getElementById("timer-card-" + newlyAddedId), ambCls), dur + 70);
        }
      }

      if (ambCls) {
        visible.forEach(t => {
          if (t.id === newlyAddedId) return;
          addAmbient(document.getElementById("timer-card-" + t.id), ambCls);
        });
      }
    }

    function startTimerLoop() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (activeTimers.length === 0) { clearInterval(timerInterval); timerInterval = null; return; }
        const done = [];
        activeTimers.forEach(t => {
          if (t.completing) return;
          t.remainingSec = Math.max(0, t.remainingSec - 1);

          const cEl = document.getElementById("timer-clock-" + t.id);
          if (cEl) cEl.textContent = formatClockReadout(t.remainingSec);

          const pct = Math.max(0, Math.min(100, (t.remainingSec / t.totalSec) * 100));
          const bEl = document.getElementById("timer-bar-" + t.id);
          if (bEl) bEl.style.width = pct + "%";
          const rEl = document.getElementById("timer-ring-" + t.id);
          if (rEl) rEl.setAttribute("stroke-dashoffset", String(125.6 - (125.6 * pct) / 100));

          const card = document.getElementById("timer-card-" + t.id);
          if (card && STATE.config.urgentPulse !== false && (STATE.config.urgentSec || 0) > 0
              && t.remainingSec <= STATE.config.urgentSec && t.remainingSec > 0
              && !card.classList.contains("timer-urgent")) {
            card.classList.add("timer-urgent");
            if (!card.querySelector(".urgent-veil")) {
              const veil = document.createElement("div");
              veil.className = "urgent-veil absolute inset-0 pointer-events-none";
              veil.style.background = STATE.timerStyle.accent;
              veil.style.opacity = ".2";
              card.prepend(veil);
            }
          }

          if (STATE.config.tickCountdown && t.remainingSec > 0 && t.remainingSec <= 3) playTick();
          if (t.remainingSec <= 0) { t.completing = true; done.push(t); }
        });

        done.forEach(d => {
          playSynthSound(STATE.timerSound, STATE.config.customTimerAudioUrl, true);
          const endMsg = STATE.config.endChatTemplate
            .replace(/\{user\}/gi, d.user)
            .replace(/\{reward\}/gi, d.title)
            .replace(/\{description\}/gi, d.description)
            .replace(/\{duration\}/gi, d.durationLabel);
          sendChatCallback(d.platform, endMsg, "end", d.redemptionId, {
            user: d.user, reward: d.title, description: d.description, duration: d.durationLabel
          });

          const el = document.getElementById("timer-card-" + d.id);
          const fx = d.fx || STATE.fx;
          if (el) {
            removeAmbient(el, STATE.ambientTimerCls || "");
            el.classList.remove("timer-urgent");
            el.style.transition = "transform " + fx.dur + "ms " + fx.ease + ", opacity " + fx.dur + "ms ease, filter " + fx.dur + "ms ease";
            el.style.transform = fx.outTx;
            el.style.opacity = "0";
            el.style.filter = "blur(" + (fx.blur || "0px") + ")";
          }
          setTimeout(() => {
            activeTimers = activeTimers.filter(x => x.id !== d.id);
            renderTimers();
          }, (fx.dur || 400) + 40);
        });
      }, 1000);
    }

    /* ---------------- STREAMER.BOT WEBSOCKET (unchanged) ---------------- */
    function connectOBSWebSocket() {
      ws = new WebSocket(STATE.config.wsUrl || "ws://127.0.0.1:8080/");
      ws.onopen = () => {
        ws.send(JSON.stringify({
          request: "Subscribe",
          id: "obs_reward_overlay",
          events: { Twitch: ["RewardRedemption"], Kick: ["RewardRedemption"], General: ["Custom"] }
        }));
        ws.send(JSON.stringify({ request: "GetActions", id: "fetch-actions" }));
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.id === "fetch-actions" || Array.isArray(msg.actions)) {
            const list = Array.isArray(msg.actions) ? msg.actions : [];
            Object.keys(actionSlots).forEach(k => {
              const targetName = (actionSlots[k].name || "").toLowerCase();
              if (!targetName) return;
              const match = list.find(a => (a.name || "").toLowerCase() === targetName);
              if (match) { actionSlots[k].id = match.id; actionSlots[k].name = match.name; }
            });
            return;
          }
          if (!msg.event || !msg.data) return;
          const d = msg.data;
          const customPayload = (d.overlayType === "channelRewardAlert" || d.eventName === "RewardStudio.Redemption")
            ? d
            : ((d.data && (d.data.overlayType === "channelRewardAlert" || d.data.eventName === "RewardStudio.Redemption")) ? d.data : null);

          if (customPayload) { triggerRewardEvent(customPayload); return; }

          if ((msg.event.type || "").toLowerCase() === "rewardredemption") {
            const red = d.redemption || d;
            const reward = red.reward || d.reward || {};
            const uObj = red.user || d.user || {};
            const platform = (msg.event.source || "").toLowerCase().indexOf("kick") >= 0 ? "kick" : "twitch";
            const user = red.user_name || d.user_name || uObj.display_name || uObj.name || uObj.username || "Viewer";
            const userLogin = red.user_login || d.user_login || uObj.login || user;
            const rawPrompt = reward.prompt || reward.description || d.prompt || d.rewardPrompt || "";
            const userInput = red.user_input || d.user_input || d.rawInput || d.message || "";
            const fullDesc = [rawPrompt, (userInput && userInput !== rawPrompt) ? userInput : ""].filter(Boolean).join(" - ");
            triggerRewardEvent({
              redemptionId: red.id || d.id || ("nat_" + Date.now()),
              platform: platform,
              user: user,
              userLogin: userLogin,
              avatar: d.user_avatar || uObj.profile_image_url || "",
              title: reward.title || d.reward_title || "Channel Reward",
              description: fullDesc,
              startChatSent: false
            });
          }
        } catch (err) {}
      };
      ws.onclose = () => setTimeout(connectOBSWebSocket, 4000);
    }

    window.addEventListener("load", () => { connectOBSWebSocket(); });
  </script>
