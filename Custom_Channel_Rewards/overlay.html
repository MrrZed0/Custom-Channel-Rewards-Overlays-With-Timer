    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
    .font-arcade { font-family: 'Press Start 2P', monospace; }
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
    .font-righteous { font-family: 'Righteous', sans-serif; }
    .timer-stack-item { transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1); }

          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + dur + 0.02);
        });
      } catch (e) {}
    }

    function parseRewardTimerFromDescription(desc, titleFallback) {
      const combined = ((desc || "") + " " + (titleFallback || "")).trim();
      if (!combined) return null;
      const endRx = /\(\s*(\d+)\s*:\s*(\d+)(?:\s*:\s*(\d+))?\s*\)\s*$/;
      const anyRx = /\(\s*(\d+)\s*:\s*(\d+)(?:\s*:\s*(\d+))?\s*\)/;
      const m = (desc && desc.match(endRx)) || (desc && desc.match(anyRx)) || combined.match(endRx) || combined.match(anyRx);
      if (!m) return null;
      let h = 0, min = 0, s = 0;
      if (m[3] !== undefined) { h = parseInt(m[1],10)||0; min = parseInt(m[2],10)||0; s = parseInt(m[3],10)||0; }
      else { min = parseInt(m[1],10)||0; s = parseInt(m[2],10)||0; }
      const totalSeconds = h * 3600 + min * 60 + s;
      if (totalSeconds <= 0) return null;
      return { totalSeconds, formattedDuration: formatHumanDuration(totalSeconds) };
    }

    function formatHumanDuration(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const parts = [];
      if (h > 0) parts.push(h + (h === 1 ? " Hour" : " Hours"));
      if (m > 0) parts.push(m + (m === 1 ? " Min" : " Mins"));
      if (s > 0 && h === 0) parts.push(s + (s === 1 ? " Sec" : " Secs"));
      return parts.length > 0 ? parts.join(" ") : "0 Secs";
    }

    function formatClockReadout(sec) {
      const s = Math.max(0, Math.floor(sec));
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) {
        return hrs + ":" + String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
      }
      return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    }

    function sendChatCallback(platform, messageText, stage, redemptionId, extraVars) {
      if (!messageText) return;
      const stageLower = (stage || "start").toLowerCase();
      const isEnd = stageLower === "end";
      const isKick = (platform || "twitch").toLowerCase() === "kick";
      const key = (redemptionId || "msg") + ":" + stageLower;

      const slot = isKick
        ? (isEnd ? actionSlots.kickEnd : actionSlots.kickStart)
        : (isEnd ? actionSlots.twitchEnd : actionSlots.twitchStart);

      if (!slot || !slot.name) return;
      if (redemptionId && sentChatDedupe.has(key)) return;
      if (redemptionId) sentChatDedupe.add(key);

      const customArgKey = isEnd
        ? (STATE.config.endArgName || "timerMessage").trim()
        : (STATE.config.startArgName || "rewardMessage").trim();

      if (ws && ws.readyState === WebSocket.OPEN) {
        const actionObj = { name: slot.name };
        if (slot.id) actionObj.id = slot.id;
        const vars = extraVars || {};

        ws.send(JSON.stringify({
          request: "DoAction",
          action: actionObj,
          args: {
            [customArgKey]: messageText,
            rewardMessage: messageText,
            timerMessage: messageText,
            chatMessage: messageText,
            message: messageText,
            rawInput: messageText,
            platform: platform || "twitch",
            eventPhase: stageLower,
            user: vars.user || "",
            reward: vars.reward || "",
            description: vars.description || "",
            duration: vars.duration || "",
            redemptionId: redemptionId || ("obs_" + Date.now())
          },
          id: "obs_chat_" + Date.now()
        }));
      }
    }

    async function resolveAvatar(platform, userLogin, currentAvatar) {
      if (currentAvatar && currentAvatar.startsWith("http") && !currentAvatar.includes("unavatar.io")) return currentAvatar;
      if (platform === "twitch" && userLogin) {
        try {
          const r = await fetch("https://decapi.me/twitch/avatar/" + encodeURIComponent(userLogin));
          if (r.ok) {
            const txt = (await r.text()).trim();
            if (txt.startsWith("http")) return txt;
          }
        } catch (e) {}
      }
      return currentAvatar || ("https://unavatar.io/" + platform + "/" + encodeURIComponent(userLogin || "streamer"));
    }

    async function triggerRewardEvent(payload) {
      const platform = (payload.platform || "twitch").toLowerCase();
      const user = payload.user || "Viewer";
      const userLogin = payload.userLogin || user;
      const title = payload.title || "Channel Reward";
      const description = (payload.description || "").trim();
      const redemptionId = payload.redemptionId || ("obs_red_" + Date.now() + "_" + Math.random().toString(36).slice(2,6));
      const avatar = await resolveAvatar(platform, userLogin, payload.avatar);

      const timerInfo = payload.durationSeconds
        ? { totalSeconds: Number(payload.durationSeconds), formattedDuration: payload.humanDuration || formatHumanDuration(Number(payload.durationSeconds)) }
        : parseRewardTimerFromDescription(description, title);

      playSynthSound(STATE.alertSound, STATE.config.customAlertAudioUrl, false);
      const alertFx = pickAlertFx();
      renderMainAlert({ platform, user, avatar, title, description, timerInfo, fx: alertFx });

      const humanDur = timerInfo ? timerInfo.formattedDuration : "Instant";
      if (!payload.startChatSent) {
        let startMsg = STATE.config.startChatTemplate
          .replace(/\{user\}/gi, user)
          .replace(/\{reward\}/gi, title)
          .replace(/\{description\}/gi, description)
          .replace(/\{duration\}/gi, humanDur);
        if (!description) startMsg = startMsg.replace(/\s*-\s*$/, "").trim();
        sendChatCallback(platform, startMsg, "start", redemptionId, {
          user,
          reward: title,
          description,
          duration: humanDur
        });
      }

      if (timerInfo && timerInfo.totalSeconds > 0) {
        const timerFx = pickTimerFx();
        const tObj = {
          id: "t_" + Date.now() + "_" + Math.random().toString(36).slice(2,6),
          redemptionId,
          platform, user, avatar, title, description,
          totalSec: timerInfo.totalSeconds,
          remainingSec: timerInfo.totalSeconds,
          durationLabel: timerInfo.formattedDuration,
          fx: timerFx,
          updatedAt: Date.now()
        };
        if (STATE.config.moveNewestToTop) activeTimers.unshift(tObj);
        else activeTimers.push(tObj);
        renderTimers(tObj.id);
        startTimerLoop();
      }
    }

    function renderMainAlert(data) {
      const slot = document.getElementById("alertPopupSlot");
      if (alertHideTimeout) clearTimeout(alertHideTimeout);
      const master = STATE.master;
      const style = STATE.alertStyle;
      const fx = data.fx || STATE.fx;
      const isKick = data.platform === "kick";
      const platformName = isKick ? "KICK" : "TWITCH";
      const flexDir = master.dir === "col" ? "flex-col items-center text-center" : (master.dir === "row-reverse" ? "flex-row-reverse text-right" : "flex-row text-left");

      slot.innerHTML = `
        <div id="liveAlertCard" class="relative overflow-hidden ${master.radius} ${master.pad} ${master.font}"
             style="background: linear-gradient(135deg, ${style.bg1} 0%, ${style.bg2} 100%); border: ${style.borderStyle} ${style.accent}; box-shadow: 0 14px 35px -5px ${style.glow}; color: ${style.text}; transform: ${fx.inTx}; opacity: 0; filter: blur(${fx.blur || '0px'}); transition: all ${fx.dur}ms ${fx.ease};">
          <div class="flex ${flexDir} gap-3.5 items-center relative z-10">
            <img src="${escapeHtml(data.avatar)}" class="${master.avatarSize} ${master.avatarClip} object-cover" style="border: 2px solid ${style.accent};" />
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full" style="background:${style.accent}25; color:${style.accent}; border:1px solid ${style.accent}60;">${platformName} REWARD</span>
                <span class="text-xs font-bold truncate" style="color: ${style.sub};">${escapeHtml(data.user)}</span>
              </div>
              <h3 class="text-lg font-black leading-snug" style="color: ${style.text};">${escapeHtml(data.title)}</h3>
              ${data.description ? `<p class="text-xs mt-1 opacity-95" style="color: ${style.sub};">${escapeHtml(data.description)}</p>` : ''}
            </div>
          </div>
          ${STATE.config.showAlertHoldBar !== false ? `
            <div class="absolute bottom-0 left-0 right-0 h-1 bg-black/40 overflow-hidden">
              <div id="liveAlertHoldBar" class="h-full w-full" style="background: ${style.accent}; transform-origin: left center; transform: scaleX(1);"></div>
            </div>
          ` : ''}
        </div>`;

      const holdMs = Math.max(0.5, Number(STATE.config.alertHoldSec) || 6) * 1000;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        const c = document.getElementById("liveAlertCard");
        if (c) { c.style.transform = "translate(0,0) scale(1)"; c.style.opacity = "1"; c.style.filter = "blur(0px)"; }
        const hb = document.getElementById("liveAlertHoldBar");
        if (hb) { hb.style.transition = "transform " + holdMs + "ms linear"; hb.style.transform = "scaleX(0)"; }
      }));

      alertHideTimeout = setTimeout(() => {
        const c = document.getElementById("liveAlertCard");
        if (c) {
          c.style.transform = fx.outTx;
          c.style.opacity = "0";
          c.style.filter = "blur(" + (fx.blur || "0px") + ")";
          setTimeout(() => { slot.innerHTML = ""; }, fx.dur + 50);
        }
      }, holdMs);
    }

    function startTimerLoop() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (activeTimers.length === 0) { clearInterval(timerInterval); timerInterval = null; return; }
        const done = [];
        activeTimers.forEach(t => {
          if (t.completing) return;
          t.remainingSec = Math.max(0, t.remainingSec - 1);
          const cEl = document.getElementById("timer-clock-" + t.id);
          if (cEl) cEl.textContent = formatClockReadout(t.remainingSec);
          const bEl = document.getElementById("timer-bar-" + t.id);
          if (bEl) bEl.style.width = ((t.remainingSec / t.totalSec) * 100) + "%";
          if (t.remainingSec <= 0) {
            t.completing = true;
            done.push(t);
          }
        });
        done.forEach(d => {
          playSynthSound(STATE.timerSound, STATE.config.customTimerAudioUrl, true);
          const endMsg = STATE.config.endChatTemplate
            .replace(/\{user\}/gi, d.user)
            .replace(/\{reward\}/gi, d.title)
            .replace(/\{description\}/gi, d.description)
            .replace(/\{duration\}/gi, d.durationLabel);
          sendChatCallback(d.platform, endMsg, "end", d.redemptionId, {
            user: d.user,
            reward: d.title,
            description: d.description,
            duration: d.durationLabel
          });

          const el = document.getElementById("timer-card-" + d.id);
          const fx = d.fx || STATE.fx;
          if (el) {
            el.style.transition = "all " + fx.dur + "ms " + fx.ease;
            el.style.transform = fx.outTx;
            el.style.opacity = "0";
          }
          setTimeout(() => {
            activeTimers = activeTimers.filter(x => x.id !== d.id);
            renderTimers();
          }, (fx.dur || 400) + 40);
        });
      }, 1000);
    }

    function renderTimers(newlyAddedId) {
      const container = document.getElementById("activeTimersStack");
      const master = STATE.master;
      const tStyle = STATE.timerStyle;
      container.innerHTML = activeTimers.map(t => {
        const pct = Math.max(0, Math.min(100, (t.remainingSec / t.totalSec) * 100));
        const fx = t.fx || STATE.fx;
        const initStyle = (t.id === newlyAddedId)
          ? `transform: ${fx.inTx}; opacity: 0; transition: all ${fx.dur}ms ${fx.ease};`
          : `transform: translate(0,0) scale(1); opacity: 1;`;
        return `
          <div id="timer-card-${t.id}" class="timer-stack-item relative overflow-hidden ${master.radius} p-3.5 ${master.font}"
               style="background: linear-gradient(135deg, ${tStyle.bg1}f5, ${tStyle.bg2}f5); border: 1.5px solid ${tStyle.accent}; box-shadow: 0 8px 25px ${tStyle.glow}; color: ${tStyle.text}; ${initStyle}">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5 min-w-0">
                <img src="${escapeHtml(t.avatar)}" class="w-10 h-10 ${master.avatarClip} object-cover shrink-0" style="border: 1.5px solid ${tStyle.accent};" />
                <div class="min-w-0">
                  <div class="text-[11px] font-bold truncate" style="color:${tStyle.sub};">${escapeHtml(t.user)}</div>
                  <div class="text-sm font-extrabold truncate" style="color:${tStyle.text};">${escapeHtml(t.title)}</div>
                </div>
              </div>
              <div id="timer-clock-${t.id}" class="font-mono-tech text-lg font-black px-2.5 py-1 rounded-lg bg-black/45" style="color:${tStyle.accent};">
                ${formatClockReadout(t.remainingSec)}
              </div>
            </div>
            <div class="w-full h-2 bg-black/50 rounded-full overflow-hidden mt-2.5">
              <div id="timer-bar-${t.id}" class="h-full rounded-full transition-all duration-500" style="width: ${pct}%; background: ${tStyle.accent};"></div>
            </div>
          </div>`;
      }).join("");

      if (newlyAddedId) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const el = document.getElementById("timer-card-" + newlyAddedId);
          if (el) { el.style.transform = "translate(0,0) scale(1)"; el.style.opacity = "1"; }
        }));
      }
    }

    function connectOBSWebSocket() {
      ws = new WebSocket(STATE.config.wsUrl || "ws://127.0.0.1:8080/");
      ws.onopen = () => {
        ws.send(JSON.stringify({
          request: "Subscribe",
          id: "obs_reward_overlay",
          events: { Twitch: ["RewardRedemption"], Kick: ["RewardRedemption"], General: ["Custom"] }
        }));
        ws.send(JSON.stringify({ request: "GetActions", id: "fetch-actions" }));
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.id === "fetch-actions" || Array.isArray(msg.actions)) {
            const list = Array.isArray(msg.actions) ? msg.actions : [];
            Object.keys(actionSlots).forEach(k => {
              const targetName = (actionSlots[k].name || "").toLowerCase();
              if (!targetName) return;
              const match = list.find(a => (a.name || "").toLowerCase() === targetName);
              if (match) {
                actionSlots[k].id = match.id;
                actionSlots[k].name = match.name;
              }
            });
            return;
          }
          if (!msg.event || !msg.data) return;
          const d = msg.data;
          const customPayload = (d.overlayType === "channelRewardAlert" || d.eventName === "RewardStudio.Redemption")
            ? d
            : ((d.data && (d.data.overlayType === "channelRewardAlert" || d.data.eventName === "RewardStudio.Redemption")) ? d.data : null);

          if (customPayload) {
            triggerRewardEvent(customPayload);
            return;
          }
          if ((msg.event.type || "").toLowerCase() === "rewardredemption") {
            const red = d.redemption || d;
            const reward = red.reward || d.reward || {};
            const uObj = red.user || d.user || {};
            const platform = (msg.event.source || "").toLowerCase().includes("kick") ? "kick" : "twitch";
            const user = red.user_name || d.user_name || uObj.display_name || uObj.name || uObj.username || "Viewer";
            const userLogin = red.user_login || d.user_login || uObj.login || user;
            const rawPrompt = reward.prompt || reward.description || d.prompt || d.rewardPrompt || "";
            const userInput = red.user_input || d.user_input || d.rawInput || d.message || "";
            const fullDesc = [rawPrompt, (userInput && userInput !== rawPrompt) ? userInput : ""].filter(Boolean).join(" - ");
            triggerRewardEvent({
              redemptionId: red.id || d.id || ("nat_" + Date.now()),
              platform,
              user,
              userLogin,
              avatar: d.user_avatar || uObj.profile_image_url || "",
              title: reward.title || d.reward_title || "Channel Reward",
              description: fullDesc,
              startChatSent: false
            });
          }
        } catch (err) {}
      };
      ws.onclose = () => setTimeout(connectOBSWebSocket, 4000);
    }

    window.addEventListener("load", () => {
      connectOBSWebSocket();
    });
  </script>
